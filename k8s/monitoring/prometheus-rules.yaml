apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: bytebattle-devops
data:
  bytebattle-alerts.yaml: |
    groups:
      - name: bytebattle.rules
        rules:
          - alert: BackendDown
            expr: up{job="bytebattle-backend"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Backend API is down
              description: Prometheus cannot scrape the ByteBattle backend /metrics endpoint.

          - alert: FrontendDown
            expr: kube_deployment_status_replicas_available{deployment="frontend", namespace="bytebattle-devops"} < 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Frontend deployment has no available replicas
              description: The frontend deployment is unhealthy or not rolled out.

          - alert: HighBackendErrorRate
            expr: sum(rate(bytebattle_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(bytebattle_http_requests_total[5m])), 1) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Backend 5xx error rate is high
              description: More than 5% of backend API responses are 5xx over the last 5 minutes.

          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total{namespace="bytebattle-devops"}[10m]) > 2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Pod restart rate is too high
              description: A ByteBattle pod restarted more than twice during the last 10 minutes.

          - alert: HighPodCpuUsage
            expr: sum(rate(container_cpu_usage_seconds_total{namespace="bytebattle-devops", image!=""}[5m])) by (pod) > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Pod CPU usage is high
              description: A ByteBattle pod is consuming more than 0.8 CPU cores.

          - alert: HighPodMemoryUsage
            expr: container_memory_working_set_bytes{namespace="bytebattle-devops", image!=""} > 800000000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Pod memory usage is high
              description: A ByteBattle pod is using more than 800 MB of working memory.
