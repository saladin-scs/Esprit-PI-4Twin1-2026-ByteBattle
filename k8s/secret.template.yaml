apiVersion: v1
kind: Secret
metadata:
  name: bytebattle-secrets
  namespace: bytebattle-devops
  labels:
    app.kubernetes.io/name: bytebattle
type: Opaque
stringData:
  JWT_SECRET: CHANGE_ME_JWT_SECRET
  RABBITMQ_DEFAULT_USER: CHANGE_ME_RABBITMQ_USER
  RABBITMQ_DEFAULT_PASS: CHANGE_ME_RABBITMQ_PASSWORD
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: CHANGE_ME_GRAFANA_PASSWORD
  ALERTMANAGER_WEBHOOK_URL: https://hooks.slack.com/services/REPLACE/ME
  ALERTMANAGER_EMAIL_TO: alerts@example.com
  ALERTMANAGER_EMAIL_FROM: bytebattle@example.com
  ALERTMANAGER_SMARTHOST: smtp.example.com:587
  ALERTMANAGER_AUTH_USERNAME: replace-me
  ALERTMANAGER_AUTH_PASSWORD: replace-me
