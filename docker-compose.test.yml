test-runner:
  build:
    context: ./backend
    dockerfile: Dockerfile
  command: sleep infinity   # keeps the container alive
  depends_on:
    - backend
    - mongodb
    - mailhog
  environment:
    NODE_ENV: test
    BACKEND_URL: http://backend:3000
    MAILHOG_API_URL: http://mailhog:8025
    MONGODB_URI: mongodb://test:test@mongodb:27017/bytebattle_test?authSource=admin
  volumes:
    - ./backend:/app
    - /app/node_modules