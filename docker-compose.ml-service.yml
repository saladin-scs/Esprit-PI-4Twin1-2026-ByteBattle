version: '3.8'

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: bytebattle-ml-service
    ports:
      - '8001:8001'
    environment:
      - ML_SERVICE_PORT=8001
      - ML_MODEL_PATH=/app/models/recommender_artifacts.pkl
      - ALLOWED_ORIGINS=http://localhost:4173,https://localhost
    volumes:
      - ./ml-service/models:/app/models:cached
    networks:
      - bytebattle

networks:
  bytebattle:
    driver: bridge
