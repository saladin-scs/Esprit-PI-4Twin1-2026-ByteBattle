name: CD Frontend

on:
  workflow_run:
    workflows: ['CI Frontend']
    types: [completed]
  workflow_dispatch:

jobs:
  frontend-cd:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set image tag
        id: vars
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          build-args: |
            VITE_API_URL=/bb-api
          tags: |
            registry/project-frontend:${{ steps.vars.outputs.sha_short }}

      - name: Setup kubectl
        if: ${{ secrets.KUBECONFIG != '' }}
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: ${{ secrets.KUBECONFIG != '' }}
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Deploy frontend to Kubernetes
        if: ${{ secrets.KUBECONFIG != '' }}
        shell: bash
        run: |
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl -n bytebattle-devops set image deployment/frontend frontend=registry/project-frontend:${{ steps.vars.outputs.sha_short }}
          kubectl -n bytebattle-devops rollout status deployment/frontend --timeout=180s
