version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: bytebattle-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-bytebattle}
    volumes:
      - mongodb_data:/data/db
    networks:
      - bytebattle-network

  ai-service:
    build:
      context: ./bytebattle-ai-service
      dockerfile: Dockerfile
    container_name: bytebattle-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - bytebattle-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bytebattle-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:password@mongodb:27017/bytebattle?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HTTP_BODY_LIMIT: ${HTTP_BODY_LIMIT:-1mb}
      RATE_LIMIT_POINTS_PER_MINUTE: ${RATE_LIMIT_POINTS_PER_MINUTE:-120}
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - bytebattle-network
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bytebattle-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bytebattle-network
    command: npm run dev

volumes:
  mongodb_data:

networks:
  bytebattle-network:
    driver: bridge

