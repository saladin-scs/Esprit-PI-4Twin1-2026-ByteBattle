version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: bytebattle-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: bytebattle
    volumes:
      - mongodb_data:/data/db
    networks:
      - bytebattle-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bytebattle-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/bytebattle?authSource=admin
      JWT_SECRET: your-secret-key-change-in-production
      PORT: 3000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - bytebattle-network
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bytebattle-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bytebattle-network
    command: npm run dev

volumes:
  mongodb_data:

networks:
  bytebattle-network:
    driver: bridge

