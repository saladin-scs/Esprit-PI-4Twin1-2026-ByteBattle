version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: bytebattle-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: bytebattle
    volumes:
      - mongodb_data:/data/db
    networks:
      - bytebattle-network

  ai-service:
    build:
      context: ./bytebattle-ai-service
      dockerfile: Dockerfile
    container_name: bytebattle-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - bytebattle-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bytebattle-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/bytebattle?authSource=admin
      JWT_SECRET: your-secret-key-change-in-production
      PORT: 3000
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - bytebattle-network
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bytebattle-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bytebattle-network
    command: npm run dev

volumes:
  mongodb_data:

networks:
  bytebattle-network:
    driver: bridge

