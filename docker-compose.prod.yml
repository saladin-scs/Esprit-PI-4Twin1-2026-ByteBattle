services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"   # match Vagrant
    volumes:
      - mongodb_data:/data/db
    networks:
      - bytebattle

  backend:
    build:
      context: ./backend   # build local (IMPORTANT)
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "3001:3000"   # host 3001 → container 3000 (NestJS)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      MONGODB_URI: ${MONGODB_URI}
      # 127.0.0.1 inside the container is not the host — use host.docker.internal for Piston on the host (port 2000)
      PISTON_ENDPOINT: ${PISTON_ENDPOINT:-http://host.docker.internal:2000/api/v2/execute}
    networks:
      - bytebattle

  frontend:
    build:
      context: ./frontend   # build local
      args:
        VITE_API_URL: /bb-api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:8080"
    networks:
      bytebattle:
        aliases:
          - backend-service

volumes:
  mongodb_data:

networks:
  bytebattle:
    driver: bridge
